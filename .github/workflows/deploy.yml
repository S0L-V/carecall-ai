name: Deploy AI Server to Amazon EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v3 -> v4 업데이트

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v2 -> v3 업데이트

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # v2 -> v3 업데이트
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # v4 -> v5 업데이트
        with:
          context: .
          push: true
          # 여기에 Docker Hub에 직접 만든 레포지토리 이름이 정확히 들어가야 합니다.
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nabi-ai-server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/nabi-ai-server:latest
            docker stop ai-server || true
            docker rm ai-server || true
            docker image prune -f
            docker run -d --name ai-server -p 8000:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/nabi-ai-server:latest